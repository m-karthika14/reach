<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>REACH</title>
  <link rel="stylesheet" href="../styles/popup.css" />
</head>

<body>
  <header>
    <h1>REACH</h1>
    <button id="voiceBtn" class="voice-btn" data-state="idle" aria-label="Activate REACH">🎙</button>
  </header>

  <div id="voiceStatus" class="voice-status" role="status" aria-live="polite"></div>
  <div id="voiceTranscript" class="voice-transcript" aria-live="polite"></div>

  <div class="row wrap">
    <label class="check"><input type="checkbox" id="wakeToggle" checked /> say “REACH”</label>
    <label class="check"><input type="checkbox" id="ttsToggle" checked /> speak replies</label>
    <a href="#" id="micSetup" class="hint">mic setup</a>
  </div>

  <section class="panel chat">
    <div class="row space-between">
      <h2>Conversation</h2>
      <button id="newChat" class="tiny">New chat</button>
    </div>
    <div id="chatLog" class="chat-log"></div>
    <div class="row">
      <input type="text" id="chatInput" placeholder="Talk to REACH…" />
      <button id="chatSend" class="primary">Send</button>
    </div>
    <div id="sessionInfo" class="hint"></div>
  </section>

  <div id="memoryPanel" class="mem-panel"></div>

  <details id="adv">
    <summary>Settings</summary>
    <div class="row">
      <input type="text" id="backend" placeholder="http://127.0.0.1:8080" />
      <input type="text" id="userId" class="user-id" value="demo-user" title="user id" />
    </div>
    <div class="row">
      <label class="pref">Style
        <select id="prefVerbosity">
          <option value="concise">concise</option>
          <option value="normal" selected>normal</option>
          <option value="detailed">detailed</option>
        </select>
      </label>
      <label class="pref">Language
        <select id="prefLanguage">
          <option value="en" selected>English</option>
          <option value="kn">Kannada</option>
          <option value="hi">Hindi</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label class="pref">Confirm
        <select id="prefConfirm">
          <option value="always">always</option>
          <option value="risky_only" selected>risky only</option>
          <option value="minimal">minimal</option>
        </select>
      </label>
      <label class="pref">Navigation
        <select id="prefNav">
          <option value="direct" selected>direct</option>
          <option value="menu_first">menu first</option>
          <option value="search_first">search first</option>
        </select>
      </label>
    </div>
    <button id="refreshMemory" class="tiny">Refresh memory</button>
  </details>

  <script src="popup.js"></script>
</body>
</html>
